[project]
name = "kit-accounts"
version = "0.1.0"
description = "MaxStorm public Python kit for accounts and points (kit-accounts, maxkit-*)."
requires-python = ">=3.11"
dependencies = [
  "maxkit-contracts",
  "maxkit-guard",
  "maxkit-identity",
  "maxkit-internal-http",
  "maxkit-points",
  "maxkit-s1",
  "maxkit-usage-bridge",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
maxkit-contracts = { workspace = true }
maxkit-guard = { workspace = true }
maxkit-identity = { workspace = true }
maxkit-points = { workspace = true }
maxkit-internal-http = { workspace = true }
maxkit-s1 = { workspace = true }
maxkit-usage-bridge = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = [
  "maxkit-points[postgres]",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
  "maxkit_contracts",
  "maxkit_guard",
  "maxkit_identity",
  "maxkit_points",
  "maxkit_s1",
  "maxkit_usage_bridge",
  "maxkit_internal_http",
]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
markers = [
  "postgres: tests that need an ephemeral local PostgreSQL (skipped when unavailable)",
]
