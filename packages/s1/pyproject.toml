[project]
name = "maxkit-s1"
version = "0.1.0"
description = "S1 L1 minimum CLI for VO EN→ZH format-contract checks (templates A and B)."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2",
]

[project.scripts]
maxkit-s1-l1 = "maxkit_s1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/maxkit_s1"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
