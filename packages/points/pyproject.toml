[project]
name = "maxkit-points"
version = "0.1.0"
description = "Single-balance points engine: lot, append-only entry, and hold."
requires-python = ">=3.11"
dependencies = [
  "maxkit-contracts>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/maxkit_points"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv.sources]
maxkit-contracts = { workspace = true }
