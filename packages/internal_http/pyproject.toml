[project]
name = "maxkit-internal-http"
version = "0.1.0"
description = "Local/staging HTTP inbound for Hub meter-events. Not a production gateway."
requires-python = ">=3.11"
dependencies = [
  "maxkit-points>=0.1.0",
  "maxkit-usage-bridge>=0.1.0",
  "starlette>=0.41,<1",
  "uvicorn>=0.32",
]

[project.scripts]
maxkit-meter-http = "maxkit_internal_http.http:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/maxkit_internal_http"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv.sources]
maxkit-points = { workspace = true }
maxkit-usage-bridge = { workspace = true }
