[project]
name = "maxkit-contracts"
version = "0.1.0"
description = "JSON Schema and golden vectors for MaxStorm person, org, and points records."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/maxkit_contracts"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
